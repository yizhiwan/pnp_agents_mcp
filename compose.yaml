# =============================================================================
# Agent Pack — container topology.
#
#   gateway       LiteLLM proxy. Profile-gated: runs only with the `bundled`
#                 profile active, so pointing at an external gateway needs no
#                 file edit (unset COMPOSE_PROFILES and set GATEWAY_BASE_URL).
#   tools-server  MCP tools server over streamable HTTP, with a real healthcheck.
#   orchestrator  HTTP front door. Waits for tools-server to be healthy, and for
#                 the gateway too when it is present (`required: false`).
#
# Portability:
#   * every value is ${VAR:-default}; no station-specific literal anywhere
#   * the pack is bind-mounted READ-ONLY at /pack; containers cannot alter it
#   * every service runs read-only-root, non-root, no-new-privileges, with /tmp
#     as tmpfs for the little scratch space the processes need
#
# Requires Compose >= 2.20 for depends_on.<svc>.required.
#
# Note on transport: inside compose the orchestrator always reaches the tools
# server over HTTP, regardless of which station overlay is loaded. That is done
# with PACK__* config overrides below rather than a second overlay file, so
# `STATION=local docker compose up` and `STATION=prod docker compose up` both
# behave sensibly.
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-pnp-agents-mcp}

# --- shared service hardening ------------------------------------------------
x-hardening: &hardening
  restart: ${RESTART_POLICY:-unless-stopped}
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1777,size=${TMPFS_SIZE:-64m}
  logging:
    driver: ${LOG_DRIVER:-json-file}
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: "${LOG_MAX_FILE:-3}"

x-pack-mount: &pack-mount
  type: bind
  source: .
  target: /pack
  read_only: true

services:
  # ---------------------------------------------------------------------------
  # Model gateway
  # ---------------------------------------------------------------------------
  gateway:
    <<: *hardening
    profiles:
      - bundled
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        LITELLM_VERSION: ${LITELLM_VERSION:-1.63.14}
    image: ${IMAGE_PREFIX:-pnp-agents-mcp}/gateway:${IMAGE_TAG:-1.0.0}
    environment:
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_PORT: ${GATEWAY_PORT:-4000}
      GATEWAY_BIND_ADDR: ${GATEWAY_BIND_ADDR:-0.0.0.0}
      GATEWAY_ENABLED_ALIASES: ${GATEWAY_ENABLED_ALIASES:-}
      GATEWAY_CONFIG: /pack/gateway/litellm_config.yaml
      GATEWAY_RUNTIME_CONFIG: /tmp/litellm.runtime.yaml
      # Provider credentials — supply only the ones you use. Aliases without a
      # credential are dropped at boot with a warning, not a failure.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Alias -> provider model overrides. Empty means "use the documented
      # default from gateway/start.sh".
      ALIAS_GPT_4O_MODEL: ${ALIAS_GPT_4O_MODEL:-}
      ALIAS_GPT_4O_MINI_MODEL: ${ALIAS_GPT_4O_MINI_MODEL:-}
      ALIAS_CLAUDE_SONNET_MODEL: ${ALIAS_CLAUDE_SONNET_MODEL:-}
      ALIAS_CLAUDE_HAIKU_MODEL: ${ALIAS_CLAUDE_HAIKU_MODEL:-}
      ALIAS_GEMINI_PRO_MODEL: ${ALIAS_GEMINI_PRO_MODEL:-}
      ALIAS_GEMINI_FLASH_MODEL: ${ALIAS_GEMINI_FLASH_MODEL:-}
      ALIAS_LOCAL_LLAMA_MODEL: ${ALIAS_LOCAL_LLAMA_MODEL:-}
      ALIAS_OPENROUTER_DEEPSEEK_MODEL: ${ALIAS_OPENROUTER_DEEPSEEK_MODEL:-}
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-4000}:${GATEWAY_PORT:-4000}/tcp"
    volumes:
      - <<: *pack-mount
    extra_hosts:
      # Lets the local-llama alias reach an Ollama server on the host.
      - "host.docker.internal:host-gateway"
    networks:
      - pack
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'
          + os.environ.get('GATEWAY_PORT','4000')
          + '/health/liveliness', timeout=4).status == 200 else 1)"
      interval: ${HEALTH_INTERVAL:-15s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${GATEWAY_START_PERIOD:-45s}
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPUS:-1.0}"
          memory: ${GATEWAY_MEMORY:-1024m}

  # ---------------------------------------------------------------------------
  # MCP tools server
  # ---------------------------------------------------------------------------
  tools-server:
    <<: *hardening
    build:
      context: ./mcp/tools-server
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: ${IMAGE_PREFIX:-pnp-agents-mcp}/tools-server:${IMAGE_TAG:-1.0.0}
    environment:
      MCP_SERVER_NAME: tools-server
      # Always http in compose; stdio is for host-native runs.
      MCP_TRANSPORT: http
      MCP_BIND_HOST: ${TOOLS_SERVER_BIND_ADDR:-0.0.0.0}
      MCP_PORT: ${TOOLS_SERVER_PORT:-8081}
      MCP_MOUNT_PATH: ${MCP_MOUNT_PATH:-/mcp}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-none}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      GEOCODE_BASE_URL: ${GEOCODE_BASE_URL:-https://geocoding-api.open-meteo.com/v1/search}
      SHELL_ENABLED: ${SHELL_ENABLED:-true}
      SHELL_ALLOWLIST: ${SHELL_ALLOWLIST:-echo,ls,cat,pwd,whoami,date,uname,df,uptime}
      SHELL_TIMEOUT_SECONDS: ${SHELL_TIMEOUT_SECONDS:-15}
      SHELL_MAX_OUTPUT_BYTES: ${SHELL_MAX_OUTPUT_BYTES:-65536}
      SHELL_WORKDIR: /tmp
    ports:
      - "${TOOLS_SERVER_BIND_HOST:-127.0.0.1}:${TOOLS_SERVER_PORT:-8081}:${TOOLS_SERVER_PORT:-8081}/tcp"
    networks:
      - pack
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'
          + os.environ.get('MCP_PORT','8081')
          + '/health', timeout=4).status == 200 else 1)"
      interval: ${HEALTH_INTERVAL:-15s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${TOOLS_SERVER_START_PERIOD:-20s}
    deploy:
      resources:
        limits:
          cpus: "${TOOLS_SERVER_CPUS:-0.5}"
          memory: ${TOOLS_SERVER_MEMORY:-512m}

  # ---------------------------------------------------------------------------
  # Orchestrator
  # ---------------------------------------------------------------------------
  orchestrator:
    <<: *hardening
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: ${IMAGE_PREFIX:-pnp-agents-mcp}/orchestrator:${IMAGE_TAG:-1.0.0}
    environment:
      PACK_DIR: /pack
      STATION: ${STATION:-local}
      ORCHESTRATOR_BIND_ADDR: ${ORCHESTRATOR_BIND_ADDR:-0.0.0.0}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_WAIT_SECONDS: ${GATEWAY_WAIT_SECONDS:-60}
      # Reach the gateway by service name unless an external URL is given.
      GATEWAY_HOST: ${GATEWAY_HOST:-gateway}
      GATEWAY_PORT: ${GATEWAY_PORT:-4000}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
      # Config overrides (see config_loader.py): force HTTP transport to the
      # tools-server service whatever the station overlay says, because inside
      # compose the tools server is its own container.
      PACK__MCP__SERVERS__TOOLS_SERVER__TRANSPORT: http
      PACK__MCP__SERVERS__TOOLS_SERVER__HOST: ${MCP_HOST:-tools-server}
      PACK__MCP__SERVERS__TOOLS_SERVER__PORT: ${TOOLS_SERVER_PORT:-8081}
      PACK__MCP__SERVERS__TOOLS_SERVER__MOUNT_PATH: ${MCP_MOUNT_PATH:-/mcp}
    ports:
      - "${ORCHESTRATOR_BIND_HOST:-127.0.0.1}:${ORCHESTRATOR_PORT:-8080}:${ORCHESTRATOR_PORT:-8080}/tcp"
    volumes:
      - <<: *pack-mount
    depends_on:
      tools-server:
        condition: service_healthy
      gateway:
        condition: service_healthy
        # Absent when the bundled profile is off: an external gateway is fine.
        required: false
    networks:
      - pack
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'
          + os.environ.get('ORCHESTRATOR_PORT','8080')
          + '/health', timeout=4).status == 200 else 1)"
      interval: ${HEALTH_INTERVAL:-15s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${ORCHESTRATOR_START_PERIOD:-30s}
    deploy:
      resources:
        limits:
          cpus: "${ORCHESTRATOR_CPUS:-1.0}"
          memory: ${ORCHESTRATOR_MEMORY:-1024m}

networks:
  pack:
    name: ${COMPOSE_PROJECT_NAME:-pnp-agents-mcp}_net
    driver: bridge
